name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test the local connection core
        run: ./build.sh --test
      - name: Build the Mac app
        run: ./build.sh
      - name: Test sanitized diagnostics
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the optional resource profiler
        run: ./scripts/resource-profile.sh --build-helper /tmp/fire-tv-resource-profiler
      - name: Package the app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Fire TV Companion.app' 'dist/Fire-TV-Companion.zip'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Fire-TV-Companion-${{ matrix.os }}
          path: dist/Fire-TV-Companion.zip
